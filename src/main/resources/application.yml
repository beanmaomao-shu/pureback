server:
  port: 8888
  address: 0.0.0.0

spring:
  profiles:
    # 本地联调请用 dev（含 Redis/MySQL 配置）；生产部署可改为 prod
    active: prod
  aop:
    proxy-target-class: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

drainer:
  threshold:
    pressure:
      level2: 90
      level3: 100
    stage:
      level2: 100
      level3: 200
    pH:
      acid2: 2.0
      acid3: 1.0
      alkali2: 12
      alkali3: 13
    battery:
      level2: 20
      level3: 10

  equipment:
    max-offline-time: 1 #单位分钟

  data:
    max-seconds: 30
    max-x: 300
    filter: 2

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: satoken
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
